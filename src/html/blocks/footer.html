<footer class="flex padding">


    <div class="def_div footer__container">

        <h2 class="footer-title">
            Вы можете отправить нам заявку, мы свяжемся с вами в ближайшее время
        </h2>

        <div class="main-title-line-container ">

            <div class="main-title-line-item ">

            </div>

            <svg class="main-title-line-icon" role="none" data-mode="fill" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 448 512">
                <path
                    d="M443.5 162.6l-7.1-7.1c-4.7-4.7-12.3-4.7-17 0L224 351 28.5 155.5c-4.7-4.7-12.3-4.7-17 0l-7.1 7.1c-4.7 4.7-4.7 12.3 0 17l211 211.1c4.7 4.7 12.3 4.7 17 0l211-211.1c4.8-4.7 4.8-12.3.1-17z">
                </path>
            </svg>

            <div class="main-title-line-item"></div>

        </div>

        <form data-form class="footer-form">
            <div data-error class="footer-form-item margin-bot-16px ">
                <label for="name">Ваше имя <span>*</span></label>
                <input data-required data-min="1" type="text" id="name" name="name">
            </div>
            <div data-error class="footer-form-item margin-bot-16px">
                <label for="phone">Ваш номер телефона <span>*</span></label>
                <input data-required data-mask="phone" data-phone type="tel" id="phone" name="phone">
            </div>
            <div data-error class="footer-form-item margin-bot-32px">
                <label for="description">Краткое описание <span>*</span></label>
                <input data-required data-min="1" type="text" id="description" name="description">
            </div>

         

            <button class="button" type="submit">
                Отправить
            </button>
            <div data-error class="popup-checkbox-container">
                <label for="popup-checkbox" class="popup-checkbox-label">
                    <input data-required data-checkbox id="popup-checkbox" name="checkbox" type="checkbox">
                    <span class="popup-checkbox-ui" aria-hidden="true"></span>
                </label>
                <div class="popup-form-politic">Даю согласие на <a href="#">обработку персональных данных</a></div>
            </div>
        </form>

    </div>


</footer>
